[settings]
experimental = true
# Read other version managers' files (.nvmrc/.node-version, .ruby-version/Gemfile,
# .java-version/.sdkmanrc) for non-mise repos. Opt-in per tool: parsing adds per-dir
# overhead, and some tools (go's go.mod, terraform's main.tf) pin surprising versions.
idiomatic_version_file_enable_tools = ["node", "ruby", "java", "python"]
# Install corepack shims (yarn/pnpm) after each node install.
node.corepack = true

# Global toolchain. Override per-project with a local mise.toml / .mise.toml.
# Note: `mise use -g …` rewrites this file and can replace the stow symlink with a
# real file — treat this repo copy as canonical and re-`stow mise` if that happens.
[tools]
node      = "lts"
ruby      = "latest"
python    = "latest"   # standalone build; brings python3 + pip
java      = "temurin-21"
clojure   = "latest"   # provides clj/clojure
leiningen = "latest"
go        = "latest"
gh        = "latest"
starship  = "latest"   # shell prompt; prebuilt aarch64 binary (no rust needed)
# Explicit aqua backend: the bare `terraform` name fails to resolve a backend here,
# but aqua:hashicorp/terraform lists versions and has linux/arm64 builds.
"aqua:hashicorp/terraform" = "latest"
rust      = "stable"   # rustup-direct only if a project needs nightly/components/targets
# sops decrypts secrets at startup. Use the github backend (release binary) — it has
# linux/arm64 assets, which the default aqua package lacks. The bare asset is named
# `sops-vX.Y.Z.linux.arm64`, so without help `sops` never lands on PATH; `bin = "sops"`
# renames it. (ubi works too but its backend is deprecated.)
"github:getsops/sops" = { version = "latest", bin = "sops" }
# Editor. Explicit aqua backend so we get the official linux/arm64 release tarball
# (the bare `neovim` name can resolve to the vfox plugin, which builds from source).
# Pinned to 0.11.x: nvim-treesitter's `master` branch is frozen and does NOT
# support Neovim 0.12 (injection API change crashes the highlighter). Unpin once
# we migrate treesitter.lua to the `main` branch (the 0.12-supported rewrite).
"aqua:neovim/neovim" = "0.11.7"   # >=0.11 for builtin LSP/treesitter/gc
# Dev tools that double as CLI/CI/pre-commit commands, so they live here (on PATH)
# rather than inside the editor; nvim's formatter/linter point at these binaries.
ruff       = "latest"          # python lint + format
shellcheck = "latest"          # shell lint
"npm:prettier" = "latest"      # web/markdown/yaml format (via mise node)
direnv     = "latest"          # per-dir env loading (hooked in zsh; starship module)
# git pager. Explicit aqua backend for the official linux/arm64 release (same reason
# as neovim/terraform above); the bare name can resolve to a source-build backend.
"aqua:dandavison/delta" = "latest"
# AWS CLI for the ticket-categorisation repo (SSO login + Bedrock). Default backend
# is already the official aqua release binary.
"aqua:aws/aws-cli" = "latest"
# uv: Python env/dependency manager for the ticket-categorisation repo. Default
# backend is already the official aqua release binary.
"aqua:astral-sh/uv" = "latest"
